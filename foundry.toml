[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
# Runtime verification resolves immutable reference IDs against the matching source AST.
ast = true
additional_compiler_profiles = [
    { name = "posm", via_ir = true, optimizer_runs = 500 },
    { name = "small", via_ir = true, optimizer_runs = 200 },
]
compilation_restrictions = [
    { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
    { paths = "src/**", optimizer_runs = 200 },
]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read-write", path = "./test-export" }]
# TOOLCHAIN QUIRK: forge 1.4.3 narrows vm.getCode/deployCode's "available artifacts" to only what the
# currently-selected test's own import graph reaches (foundry-rs/foundry#12231, fixed upstream in #12927 but not
# in this pinned version). V4Fixture's PositionManager is deployed via deployCode from a file imported only by
# test/utils/PosmArtifact.sol, which no single test contract imports directly, so any `--match-contract`/`--mt`
# run fails with "no matching artifact found" even though the artifact exists in `out/`. This is the officially
# documented escape hatch for that restriction; it does not affect which contracts get compiled or their bytecode.
unchecked_cheatcode_artifacts = true

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
# Unexpected handler reverts (including failed assertions) must fail everyday checks.
fail_on_revert = true

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[fmt]
line_length = 120
